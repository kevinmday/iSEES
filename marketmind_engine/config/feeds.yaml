# -------------------------------------------------------------------
# MarketMind Feed Configuration
# -------------------------------------------------------------------
# Feeds define narrative signal sources.
# Parsers are selected by `type`.
# Only enabled feeds are loaded.
# -------------------------------------------------------------------

version: 1

global:
  refresh_interval_seconds: 120
  max_entries_per_feed: 50
  default_weight: 1.0
  enabled: true

feeds:

  # ===============================================================
  # MACRO NEWS
  # ===============================================================

  - id: cnn_top
    type: rss
    url: https://rss.cnn.com/rss/edition.rss
    domain: macro
    weight: 1.0
    enabled: true

  - id: reuters_top
    type: rss
    url: https://feeds.reuters.com/reuters/topNews
    domain: macro
    weight: 1.2
    enabled: true


  # ===============================================================
  # AI-BIO SECTOR
  # ===============================================================

  - id: ai_bio_google
    type: rss
    url: https://news.google.com/rss/search?q=AI+biotech+stock
    domain: ai-bio
    weight: 1.5
    enabled: true


  # ===============================================================
  # DEFENSE SECTOR
  # ===============================================================

  - id: defense_google
    type: rss
    url: https://news.google.com/rss/search?q=defense+stocks
    domain: defense
    weight: 1.3
    enabled: true


  # ===============================================================
  # FDA REGULATORY SIGNALS
  # ===============================================================
  # These feeds provide high-signal biotech and healthcare catalysts.
  # They often precede media coverage.

  - id: fda_press_announcements
    type: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-announcements/rss.xml
    domain: healthcare
    weight: 2.5
    enabled: true

  - id: fda_drug_approvals
    type: rss
    url: https://www.fda.gov/drugs/drug-approvals-and-databases/drug-approvals-and-databases/rss.xml
    domain: ai-bio
    weight: 3.0
    enabled: true

  - id: fda_device_recalls
    type: rss
    url: https://www.fda.gov/medical-devices/medical-device-recalls/rss.xml
    domain: healthcare
    weight: 2.0
    enabled: true


  # ===============================================================
  # INTERNAL / FUTURE SIGNAL TYPES
  # (Disabled until adapters implemented)
  # ===============================================================

  - id: rippletruth_stream
    type: rippletruth
    source: local_object_stream
    domain: narrative
    weight: 2.0
    enabled: false

  - id: itip_stream
    type: itip
    source: itip_event_bus
    domain: macro
    weight: 1.8
    enabled: false